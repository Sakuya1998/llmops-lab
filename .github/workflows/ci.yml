name: 持续集成

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装项目和开发依赖
        run: python -m pip install -e ".[dev]"
      - name: 代码静态检查
        run: ruff check .
      - name: 检查代码格式
        run: ruff format --check .
      - name: 类型检查
        run: mypy app
      - name: 运行测试并统计覆盖率
        run: pytest --cov=app/model_ops_api --cov-report=term-missing
      - name: 验证评测样例与发布门禁
        run: python pipelines/evaluation/evaluate.py
