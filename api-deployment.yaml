apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-lab-api
  labels:
    app.kubernetes.io/name: llmops-lab-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: llmops-lab-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmops-lab-api
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: llmops-lab-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # 启动探针为进程启动留出时间；就绪探针控制是否接收流量。
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # 此处只验证 API 进程存活，不代表外部模型服务已就绪。
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-lab-api
spec:
  selector:
    app.kubernetes.io/name: llmops-lab-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
