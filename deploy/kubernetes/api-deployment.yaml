apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-lab-api
  labels:
    app.kubernetes.io/name: llmops-lab-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmops-lab-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmops-lab-api
    spec:
      # 以非 root 用户运行容器，并启用默认 seccomp 配置。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: llmops-lab-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # readinessProbe 决定 Pod 是否可以接收流量。
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # livenessProbe 用于检测进程是否需要重启。
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-lab-api
spec:
  selector:
    app.kubernetes.io/name: llmops-lab-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
