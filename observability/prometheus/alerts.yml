groups:
  - name: llmops-lab-api
    rules:
      - alert: LLMOpsLabAPIDown
        expr: up{job="llmops-lab-api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLMOps 实验室 API 抓取目标不可用"
          description: "Prometheus 已连续 2 分钟无法抓取 API 指标目标。"
