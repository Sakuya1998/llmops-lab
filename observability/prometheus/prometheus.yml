global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Docker 网络场景可将 API 服务名配置为 api:8000。
  # Kubernetes 场景请按实际 namespace / Service DNS 修改 target。
  - job_name: llmops-lab-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
